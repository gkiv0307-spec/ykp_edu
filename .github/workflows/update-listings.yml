name: 경매물건 자동 최신화

# 매일 아침 블로그 RSS를 읽어 "전국 경매물건" 카드를 다시 만들고,
# 바뀐 내용이 있으면 커밋한다. main 에 푸시되면 GitHub Pages 가 자동 배포한다.
# 실행 순서가 중요하다. 같은 index.html 을 건드리는 작업이 셋이라
# 시간을 30분씩 벌려 두었다.
#   20:00 UTC  인스타그램 피드   (update-instagram.yml)
#   20:30 UTC  물건 목록 재생성  (이 파일)
#   21:00 UTC  법원 낙찰 상태    (update-property-status.yml)
# 이 순서라야 블로그에서 새로 만든 카드 위에 법원 확인 결과가 덮인다.
on:
  schedule:
    # UTC 20:30 = 한국시간 오전 5시 30분
    - cron: '30 20 * * *'
  workflow_dispatch: # 저장소 Actions 탭에서 수동 실행도 가능

# 커밋을 밀어넣어야 하므로 쓰기 권한이 필요하다.
permissions:
  contents: write

concurrency:
  group: update-listings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 이미지 변환(sharp)만 필요하므로 puppeteer 같은 devDependencies 는 건너뛴다.
      - name: 의존성 설치
        run: npm ci --omit=dev

      # 물건 목록 + 물건별 상세 페이지 + sitemap 을 한 번에 다시 만든다
      - name: 물건 목록 갱신
        run: npm run update-listings

      # 헤더·푸터를 index.html 에서 가져다 쓰므로, 메뉴가 바뀌었으면
      # 고정 페이지도 같이 다시 만들어야 어긋나지 않는다
      - name: 고정 페이지 갱신
        run: npm run build-pages

      - name: 변경분 커밋
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "바뀐 내용이 없어 커밋하지 않습니다."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html apply.html sitemap.xml listings courses data assets/properties/auto
          git commit -m "물건 목록 자동 최신화 ($(TZ=Asia/Seoul date '+%Y-%m-%d'))"
          git push
