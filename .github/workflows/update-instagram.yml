name: Update Instagram feed

on:
  schedule:
    # 20:00 UTC = 05:00 KST next day
    - cron: "0 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest Instagram posts and update the site
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node scripts/update-instagram.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html assets/instagram
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Auto-update Instagram feed"
            git push
          fi
