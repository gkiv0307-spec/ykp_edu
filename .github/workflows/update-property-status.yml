name: Update property auction status

on:
  schedule:
    # 21:00 UTC = 06:00 KST next day
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Re-check every case against courtauction.go.kr
        run: node scripts/check-court-status.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Auto-update property auction status (courtauction.go.kr)"
            git push
          fi
